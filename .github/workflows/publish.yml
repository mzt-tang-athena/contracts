name: publish
on:
  push:
    tags:
      - "v*"
      - "browser-driver-v*"
      - "vale-rules-v*"

permissions:
  contents: read
  packages: write

jobs:
  schemas:
    # The "v*" tag pattern also catches package tags that start with a
    # package name, such as vale-rules-v0.1.0. Keep this job to the bare
    # version tags, which never contain "-v".
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the package surface
        run: npm run check:package
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/schemas/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Publish
        run: npm publish --workspace @mzt-tang-athena/schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-driver:
    if: startsWith(github.ref_name, 'browser-driver-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the package surface
        run: npx publint packages/browser-driver
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#browser-driver-v}"
          version="$(node -p "require('./packages/browser-driver/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Publish
        run: npm publish --workspace @mzt-tang-athena/browser-driver
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vale-rules:
    if: startsWith(github.ref_name, 'vale-rules-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test --workspace @mzt-tang-athena/vale-rules
      - name: Check the package surface
        run: npx publint packages/vale-rules
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#vale-rules-v}"
          version="$(node -p "require('./packages/vale-rules/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Publish
        run: npm publish --workspace @mzt-tang-athena/vale-rules
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
